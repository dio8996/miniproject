<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <title>ZeroAttack – Security Audit Logs</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-['Plus_Jakarta_Sans'] p-8">
  <div class="max-w-6xl mx-auto space-y-6">
    <div class="flex justify-between items-center border-b border-slate-800 pb-4">
      <div>
        <h1 class="text-xl font-bold text-white">System Audit & Compliance Log</h1>
        <p class="text-xs text-slate-400">Immutable chronological record of logins, rule updates, and IP quarantines</p>
      </div>
      <a href="/" class="text-xs text-cyan-400 hover:underline">&larr; Back to Dashboard</a>
    </div>

    <div class="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden font-mono text-xs">
      <table class="w-full text-left">
        <thead class="bg-slate-950 text-slate-400">
          <tr>
            <th class="p-3">Timestamp</th>
            <th class="p-3">User</th>
            <th class="p-3">Action</th>
            <th class="p-3">Target</th>
            <th class="p-3">Origin IP</th>
            <th class="p-3">Details</th>
          </tr>
        </thead>
        <tbody id="audit-tbody" class="divide-y divide-slate-800">
          <!-- Populated by JS -->
        </tbody>
      </table>
    </div>
  </div>

  <script>
    fetch('/api/users/audit-logs')
      .then(r => r.json())
      .then(d => {
        const tbody = document.getElementById('audit-tbody');
        tbody.innerHTML = d.logs.map(l => `
          <tr class="hover:bg-slate-800/40">
            <td class="p-3 text-slate-400">${l.timestamp}</td>
            <td class="p-3 text-cyan-300 font-bold">${l.username}</td>
            <td class="p-3 text-white font-semibold">${l.action}</td>
            <td class="p-3 text-slate-300">${l.target || 'N/A'}</td>
            <td class="p-3 text-slate-400">${l.ip_address}</td>
            <td class="p-3 text-slate-400">${l.details}</td>
          </tr>
        `).join('');
      });
  </script>
</body>
</html>
