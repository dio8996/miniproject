<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <title>ZeroAttack – Security Incidents & Events</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-['Plus_Jakarta_Sans']">
  <div class="p-8 max-w-7xl mx-auto space-y-6">
    <div class="flex items-center justify-between border-b border-slate-800 pb-4">
      <div>
        <h1 class="text-xl font-bold text-white">Security Events & Incident Forensic Archive</h1>
        <p class="text-xs text-slate-400">Rule-based triggers, behavioral anomalies, and risk classifications</p>
      </div>
      <a href="/" class="text-xs text-cyan-400 hover:underline">&larr; Back to SOC Dashboard</a>
    </div>

    <div class="bg-slate-900 border border-slate-800 rounded-xl p-6">
      <div id="events-container" class="space-y-3 font-mono text-xs">
        <p class="text-slate-400">Loading security events...</p>
      </div>
    </div>
  </div>

  <script>
    fetch('/api/events')
      .then(r => r.json())
      .then(d => {
        const c = document.getElementById('events-container');
        if (!d.events || d.events.length === 0) {
          c.innerHTML = '<p class="text-slate-500">No events logged yet. Use the Live Security Monitor to generate incidents.</p>';
          return;
        }
        c.innerHTML = d.events.map(e => `
          <div class="p-3 bg-slate-950 border border-slate-800 rounded hover:border-cyan-500/50 flex justify-between items-center cursor-pointer" onclick="window.location='/events/${e.id}'">
            <div>
              <span class="text-cyan-400 font-bold">${e.attack_type}</span>
              <span class="text-slate-400 ml-2">from ${e.source_ip}</span>
              <p class="text-slate-500 text-[11px] mt-1">${e.request_method} ${e.request_url}</p>
            </div>
            <div class="text-right">
              <span class="font-bold text-rose-400">${e.risk_score}/100</span>
              <span class="block text-[10px] text-slate-400">${e.severity}</span>
            </div>
          </div>
        `).join('');
      });
  </script>
</body>
</html>
