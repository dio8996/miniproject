<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <title>ZeroAttack – Detection Rules Engine</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-['Plus_Jakarta_Sans'] p-8">
  <div class="max-w-6xl mx-auto space-y-6">
    <div class="flex justify-between items-center border-b border-slate-800 pb-4">
      <div>
        <h1 class="text-xl font-bold text-white">Detection Rules & Signature Library</h1>
        <p class="text-xs text-slate-400">Manage heuristic patterns, regex signatures, and threat severities</p>
      </div>
      <a href="/" class="text-xs text-cyan-400 hover:underline">&larr; Back to Dashboard</a>
    </div>

    <!-- Rule Creation -->
    <div class="bg-slate-900 border border-slate-800 rounded-xl p-6 font-mono text-xs space-y-3">
      <h2 class="text-sm font-semibold text-white">Deploy New Detection Signature</h2>
      <div class="grid grid-cols-3 gap-3">
        <input id="rule-name" placeholder="Rule Name (e.g. LDAP Injection Signature)" class="bg-slate-950 border border-slate-800 rounded p-2 text-white">
        <select id="rule-type" class="bg-slate-950 border border-slate-800 rounded p-2 text-white">
          <option value="SQL Injection">SQL Injection</option>
          <option value="Cross-Site Scripting (XSS)">Cross-Site Scripting (XSS)</option>
          <option value="Brute Force">Brute Force</option>
          <option value="Parameter Tampering">Parameter Tampering</option>
        </select>
        <select id="rule-severity" class="bg-slate-950 border border-slate-800 rounded p-2 text-white">
          <option value="LOW">LOW</option>
          <option value="MEDIUM">MEDIUM</option>
          <option value="HIGH">HIGH</option>
          <option value="CRITICAL" selected>CRITICAL</option>
        </select>
      </div>
      <div>
        <input id="rule-pattern" placeholder="Regular Expression Signature Pattern" class="w-full bg-slate-950 border border-slate-800 rounded p-2 text-white">
      </div>
      <button onclick="addRule()" class="px-4 py-2 bg-cyan-600 hover:bg-cyan-500 font-bold text-white rounded">
        Deploy Rule Signature
      </button>
    </div>

    <!-- Rules Table -->
    <div class="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden font-mono text-xs">
      <table class="w-full text-left">
        <thead class="bg-slate-950 text-slate-400">
          <tr>
            <th class="p-3">Rule Name</th>
            <th class="p-3">Attack Category</th>
            <th class="p-3">Severity</th>
            <th class="p-3">Weight</th>
            <th class="p-3">Status</th>
            <th class="p-3">Actions</th>
          </tr>
        </thead>
        <tbody id="rules-tbody" class="divide-y divide-slate-800">
          <!-- Populated by JS -->
        </tbody>
      </table>
    </div>
  </div>

  <script>
    function loadRules() {
      fetch('/api/rules').then(r => r.json()).then(d => {
        const tbody = document.getElementById('rules-tbody');
        tbody.innerHTML = d.rules.map(r => `
          <tr class="hover:bg-slate-800/40">
            <td class="p-3 text-white font-bold">${r.name}</td>
            <td class="p-3 text-cyan-300">${r.attack_type}</td>
            <td class="p-3"><span class="px-2 py-0.5 rounded text-[10px] ${r.severity === 'CRITICAL' ? 'bg-rose-950 text-rose-400' : 'bg-amber-950 text-amber-400'}">${r.severity}</span></td>
            <td class="p-3">${r.risk_weight} pts</td>
            <td class="p-3"><span class="text-[10px] ${r.is_active ? 'text-emerald-400' : 'text-slate-500'}">${r.is_active ? 'ENABLED' : 'DISABLED'}</span></td>
            <td class="p-3 space-x-2">
              <button onclick="toggleRule(${r.id})" class="px-2 py-1 bg-slate-800 hover:bg-slate-700 text-cyan-400 rounded">Toggle</button>
              <button onclick="deleteRule(${r.id})" class="px-2 py-1 bg-slate-800 hover:bg-slate-700 text-rose-400 rounded">Delete</button>
            </td>
          </tr>
        `).join('');
      });
    }

    async function addRule() {
      const name = document.getElementById('rule-name').value;
      const attack_type = document.getElementById('rule-type').value;
      const severity = document.getElementById('rule-severity').value;
      const pattern = document.getElementById('rule-pattern').value;
      if (!name || !pattern) return;
      await fetch('/api/rules', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, attack_type, severity, pattern, risk_weight: 80 })
      });
      document.getElementById('rule-name').value = '';
      document.getElementById('rule-pattern').value = '';
      loadRules();
    }

    async function toggleRule(id) {
      await fetch(`/api/rules/${id}/toggle`, { method: 'PATCH' });
      loadRules();
    }

    async function deleteRule(id) {
      await fetch(`/api/rules/${id}`, { method: 'DELETE' });
      loadRules();
    }

    loadRules();
  </script>
</body>
</html>
