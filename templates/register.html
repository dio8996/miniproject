<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <title>ZeroAttack – Register Account</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4 font-['Plus_Jakarta_Sans']">
  <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-2xl">
    <div class="text-center mb-6">
      <span class="text-2xl font-bold tracking-tight text-white flex items-center justify-center gap-2">
        <span class="h-3 w-3 rounded-full bg-cyan-400"></span>
        ZeroAttack
      </span>
      <p class="text-xs text-slate-400 mt-1">Request Security Clearance Access</p>
    </div>

    <form id="reg-form" class="space-y-4 text-xs font-mono">
      <div>
        <label class="block text-slate-400 mb-1">Username</label>
        <input id="u" type="text" class="w-full bg-slate-950 border border-slate-800 rounded p-2.5 text-white" required>
      </div>
      <div>
        <label class="block text-slate-400 mb-1">Email</label>
        <input id="e" type="email" class="w-full bg-slate-950 border border-slate-800 rounded p-2.5 text-white" required>
      </div>
      <div>
        <label class="block text-slate-400 mb-1">Passphrase</label>
        <input id="p" type="password" class="w-full bg-slate-950 border border-slate-800 rounded p-2.5 text-white" required>
      </div>
      <div>
        <label class="block text-slate-400 mb-1">Requested Clearance Role</label>
        <select id="r" class="w-full bg-slate-950 border border-slate-800 rounded p-2.5 text-white">
          <option value="VIEWER">VIEWER (Read-Only Metrics)</option>
          <option value="SECURITY ANALYST">SECURITY ANALYST (Forensics & Alert Triage)</option>
          <option value="ADMIN">ADMIN (Full Operations & IPS Control)</option>
        </select>
      </div>

      <button type="submit" class="w-full py-2.5 bg-cyan-600 hover:bg-cyan-500 font-bold text-white rounded transition">
        Create Account
      </button>
    </form>

    <div class="mt-4 text-center text-xs text-slate-400">
      Already have clearance? <a href="/login" class="text-cyan-400 hover:underline">Log in</a>
    </div>
  </div>

  <script>
    document.getElementById('reg-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const u = document.getElementById('u').value;
      const em = document.getElementById('e').value;
      const p = document.getElementById('p').value;
      const r = document.getElementById('r').value;
      const res = await fetch('/api/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: u, email: em, password: p, role: r })
      });
      if (res.ok) {
        window.location = '/login';
      }
    });
  </script>
</body>
</html>
